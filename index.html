<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomee</title>
<meta name="description" content="Roomee: split bills, chores and polls with your roommates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* Colors mirror src/theme/tokens.ts in the app. */
  :root {
    color-scheme: light;
    --bg: #f6f6fa; --surface: #ffffff; --subtle: #eff0f5; --border: #e3e5ee;
    --text: #14161c; --muted: #6b7080; --primary: #5b5bd6; --on-primary: #ffffff;
    --positive: #15803d; --positive-soft: #e6f6ec; --negative: #dc2626; --negative-soft: #fdecec; --on-danger: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0e1014; --surface: #181b22; --subtle: #222631; --border: #2c313d;
      --text: #f3f4f8; --muted: #9aa0b0; --primary: #8585f2; --on-primary: #ffffff;
      --positive: #34d399; --positive-soft: #11372a; --negative: #f87171; --negative-soft: #3d1a1a; --on-danger: #14161c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 400 15px/22px "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 520px; margin: 0 auto; padding: 32px 16px 48px; }
  .brand { font-size: 17px; line-height: 24px; font-weight: 800; color: var(--primary); letter-spacing: -0.2px; margin: 0 0 24px; }
  h1 { font-size: 28px; line-height: 36px; font-weight: 800; letter-spacing: -0.6px; margin: 0 0 8px; outline: none; }
  h2 { font-size: 17px; line-height: 24px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 12px; }
  .muted { color: var(--muted); }
  .small { font-size: 13px; line-height: 18px; font-weight: 500; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 20px; margin-top: 20px; }
  ul { margin: 0 0 12px; padding-left: 20px; }
  .card ul:last-child { margin-bottom: 0; }
  li { margin-bottom: 8px; }
  li:last-child { margin-bottom: 0; }
  label { display: block; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  .field { margin-bottom: 16px; }
  input {
    width: 100%; min-height: 52px; padding: 12px 14px; font: inherit; font-size: 16px; color: var(--text);
    background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px;
  }
  input:focus { outline: none; border-color: var(--primary); }
  button {
    width: 100%; min-height: 52px; padding: 0 18px; font: inherit; font-weight: 600; border-radius: 14px;
    border: 1px solid transparent; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button[disabled] { opacity: 0.55; cursor: default; }
  .primary { background: var(--primary); color: var(--on-primary); }
  .danger { background: var(--negative); color: var(--on-danger); }
  .outline { background: transparent; color: var(--text); border-color: var(--border); margin-top: 12px; }
  .error { background: var(--negative-soft); color: var(--negative); border-radius: 14px; padding: 12px; margin-bottom: 16px; font-size: 13px; line-height: 18px; font-weight: 500; }
  .done { background: var(--positive-soft); color: var(--positive); border-radius: 14px; padding: 12px; font-weight: 600; }
  .email { font-weight: 600; overflow-wrap: anywhere; }
  [hidden] { display: none !important; }
  a { color: var(--primary); font-weight: 600; }
  .footer { text-align: center; margin-top: 24px; }
  section {{ margin-top: 28px; }}
  h2 {{ margin-top: 0; }}
</style>
</head>
<body>
<main>
  <p class="brand"><a href="./" style="color:inherit;text-decoration:none">Roomee</a></p>
  <h1>Split bills and chores with your roommates</h1>
  <p class="muted">Roomee keeps track of who paid what, whose turn it is, and what the house decided.</p>
  <div class="card">
    <p style="margin:0 0 8px"><a href="privacy/">Privacy policy</a></p>
    <p style="margin:0 0 8px"><a href="delete-account/">Delete your account</a></p>
    <p style="margin:0">Contact: <a href="mailto:{{SUPPORT_EMAIL}}">{{SUPPORT_EMAIL}}</a></p>
  </div>
</main>
</body>
</html>
